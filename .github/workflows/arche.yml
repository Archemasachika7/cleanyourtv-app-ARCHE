# Arche fork: build the Doom-themed TV launcher and the phone app that installs it, and publish both
# APKs as a GitHub Release (tag arche-<run number>) so they can be downloaded straight onto the phone.
# tv/arche/build-arche.sh does the work; see tv/arche/README.md.
name: arche

on:
  push:
    branches: ["claude/hopeful-carson-wlv4jc", "main"]
    paths: ["tv/arche/**", "core/**", "ui/**", "feature/**", "app/**", "android/**", ".github/workflows/arche.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arche-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Build the Arche launcher and phone app
        env:
          ARCHE_KEYSTORE_B64: ${{ secrets.ARCHE_KEYSTORE_B64 }}
          ARCHE_KS_PASS: ${{ secrets.ARCHE_KS_PASS }}
        run: tv/arche/build-arche.sh

      - uses: actions/upload-artifact@v4
        with:
          name: arche-apks
          path: dist/*.apk

      - name: Publish a release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          RUN: ${{ github.run_number }}
          REF: ${{ github.ref_name }}
        run: |
          gh release create "arche-$RUN" dist/arche-phone.apk dist/arche-tv-launcher.apk \
            --repo "$GITHUB_REPOSITORY" --target "$SHA" --prerelease \
            --title "Arche Doom build $RUN" \
            --notes "Built from $REF at ${SHA:0:12}. Install arche-phone.apk on your Android phone; it puts arche-tv-launcher.apk on the TV for you. See tv/arche/README.md."
